name: OpenHuman TinyAgents fork upstream sync (one-shot)
on:
  push:
    branches:
      - integration/openhuman-structural-20261018
    paths:
      - .github/workflows/openhuman-upstream-tinyagents-sync-once.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Audit and merge TinyAgents canonical main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="integration/openhuman-structural-20261018"
          expected="$GITHUB_SHA"
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$current" != "$expected" ]; then
            echo "::error::Branch changed since this workflow started; stop before updating"
            exit 3
          fi
          git remote add canonical https://github.com/tinyhumansai/tinyagents.git
          git fetch --no-tags canonical +refs/heads/main:refs/remotes/canonical/main
          upstream="$(git rev-parse refs/remotes/canonical/main)"
          echo "Upstream TinyAgents $upstream"
          echo "Merge base $(git merge-base HEAD "$upstream")"
          mkdir -p sync-report
          echo "$upstream" > sync-report/upstream.txt
          status=0
          git merge --no-commit --no-ff "$upstream" || status=$?
          if [ "$status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee sync-report/conflicts.txt
            git ls-files -u > sync-report/unmerged-stages.txt
            git diff --cc > sync-report/combined.diff
            git status --short > sync-report/status.txt
            expected="$(printf '%s\n' 'crates/tinyagents-session/src/transcript/turn_lock_tests.rs' 'vendor/tinytools' | sort)"
            actual="$(sort sync-report/conflicts.txt)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Unreviewed TinyAgents conflicts; refusing an automatic resolution"
              exit 2
            fi
            # Only test-fixture naming differs; prefer upstream's globally
            # unique store/thread identifiers to prevent parallel-test bleed.
            git checkout --theirs -- crates/tinyagents-session/src/transcript/turn_lock_tests.rs
            git add -- crates/tinyagents-session/src/transcript/turn_lock_tests.rs
            # Preserve the structural-code additions in the fork of TinyTools,
            # now rebased by a real upstream merge and verified against its main.
            git update-index --add --cacheinfo 160000,0d349716deafc4d91a595bf85400e8445cd1a6e8,vendor/tinytools
          fi
          # GITHUB_TOKEN has contents:write but not workflows permission.
          # Sync upstream YAML through the GitHub connector after source merge.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          if git diff --name-only --diff-filter=U | grep .; then
            echo "::error::Still contains unmerged paths"
            exit 2
          fi
          git diff --cached --check
          git commit -m "merge: onboard canonical TinyAgents main ($upstream) with TinyTools structural fork"
          git push origin "HEAD:refs/heads/$branch"
      - name: Publish conflict audit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openhuman-tinyagents-sync-conflicts
          path: sync-report/
          if-no-files-found: warn
