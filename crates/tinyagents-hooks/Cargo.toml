[package]
name = "tinyagents-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typed tool, command, lifecycle, turn, and stop hooks for TinyAgents."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1.10"
tinyagents-harness = { path = "../tinyagents-harness", version = "2.2.0" }
tinyagents-graph = { path = "../tinyagents-graph", version = "2.2.0", optional = true }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.5.0" }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[features]
default = []
goals = ["dep:tinyagents-graph"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
